name: "📊 Assignment 3 — Streaming Analytics Dashboard"
description: "Submit Assignment 3 — Live dashboard for consumed streaming data (15 Marks)"
title: "[A3] <Your Full Name> — Assignment 3"
labels: ["assignment-3"]
body:
  - type: markdown
    attributes:
      value: |
        ## Assignment 3 — Streaming Analytics Dashboard
        **Due:** 1 October 2026 &nbsp;|&nbsp; **Marks:** 15 &nbsp;|&nbsp; Build a live dashboard that consumes and visualises your Kafka data.

  - type: input
    id: student_name
    attributes:
      label: "Full Name"
      placeholder: "e.g. Priya Sharma"
    validations:
      required: true

  - type: input
    id: student_id
    attributes:
      label: "Student ID / Roll Number"
      placeholder: "e.g. MBA2025-042"
    validations:
      required: true

  - type: input
    id: repo_link
    attributes:
      label: "GitHub Repository Link"
      description: "Must contain consumer.py, dashboard code, and a README"
      placeholder: "https://github.com/your-username/sda-assignment3"
    validations:
      required: true

  - type: textarea
    id: dashboard_description
    attributes:
      label: "Dashboard Description"
      description: "What does your dashboard show? List the charts/metrics displayed and the library used (matplotlib, streamlit, dash, plotly, etc.)"
      placeholder: |
        Library: Streamlit
        Charts:
        1. Line chart — Revenue per minute (last 10 mins)
        2. Bar chart — Top 5 products by sales count
        3. Gauge — Current transactions per second
        Metric cards: Total revenue today, Active stores, Alert count
    validations:
      required: true

  - type: textarea
    id: consumer_description
    attributes:
      label: "Consumer Code Description"
      description: "Explain how your consumer.py reads from Kafka and feeds data to the dashboard."
      placeholder: "consumer.py uses confluent_kafka Consumer to subscribe to 'retail-transactions', deserialises JSON messages, updates in-memory DataFrames, and Streamlit auto-refreshes every 2 seconds..."
    validations:
      required: true

  - type: textarea
    id: dashboard_screenshot
    attributes:
      label: "Dashboard Screenshot"
      description: "Attach or drag-and-drop a screenshot of your live running dashboard. This is required for grading."
      placeholder: "Drag and drop your dashboard screenshot here..."
    validations:
      required: true

  - type: textarea
    id: business_insight
    attributes:
      label: "Business Insight Write-up"
      description: "What are 2–3 business insights a manager can act on from your dashboard? How does real-time visibility change the decision they would make? (minimum 100 words)"
      placeholder: "Write your business insight here..."
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: "Overall Difficulty Rating"
      options:
        - "1 — Very easy"
        - "2 — Easy"
        - "3 — Moderate"
        - "4 — Hard"
        - "5 — Very hard"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Submission Checklist"
      options:
        - label: "consumer.py runs and reads from Kafka without errors"
          required: true
        - label: "Dashboard has at least 3 charts or metrics"
          required: true
        - label: "Dashboard screenshot is attached"
          required: true
        - label: "Business insight write-up is included"
          required: true
        - label: "My repo is public (or I have shared access with faculty)"
          required: true
        - label: "I have read and followed academic honesty guidelines"
          required: true
