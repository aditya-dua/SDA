name: "📊 Assignment 3 — Dashboard for Analysis of Consumed Data"
description: "Submit Assignment 3 (15 Marks) — Create a dashboard for the analysis of the consumed streaming data. Due: 1 October"
title: "[A3][SDA-?] <Your Full Name> — Dashboard for Analysis of Consumed Data"
labels: ["assignment-3"]
body:
  - type: markdown
    attributes:
      value: |
        ## Assignment 3 — Dashboard for Analysis of Consumed Data
        **Due:** 1 October &nbsp;|&nbsp; **Marks:** 15 &nbsp;|&nbsp; **Replace SDA-? in the title with your section: SDA-1, SDA-2, or SDA-G**
        
        Create a dashboard for the analysis of the consumed streaming data from your Kafka topic.

  - type: dropdown
    id: section
    attributes:
      label: "Section"
      description: "Which section are you enrolled in?"
      options:
        - "SDA-1"
        - "SDA-2"
        - "SDA-G"
    validations:
      required: true

  - type: input
    id: student_name
    attributes:
      label: "Full Name"
      placeholder: "e.g. Priya Sharma"
    validations:
      required: true

  - type: input
    id: student_id
    attributes:
      label: "Student ID / Roll Number"
      placeholder: "e.g. MBA2025-042"
    validations:
      required: true

  - type: input
    id: repo_link
    attributes:
      label: "GitHub Repository Link"
      description: "Must contain consumer.py, dashboard code, and a README"
      placeholder: "https://github.com/your-username/sda-assignment3"
    validations:
      required: true

  - type: textarea
    id: dashboard_description
    attributes:
      label: "Dashboard Description"
      description: "What does your dashboard show? List the charts/metrics and the tool used (MongoDB Atlas Charts, Grafana, Streamlit, Plotly, etc.)"
      placeholder: |
        Tool: MongoDB Atlas Charts / Grafana
        Charts:
        1. Line chart — Revenue per minute (last 10 mins)
        2. Bar chart — Top 5 products by sales count
        3. Gauge — Current transactions per second
        Metric cards: Total revenue today, Alert count
    validations:
      required: true

  - type: textarea
    id: consumer_description
    attributes:
      label: "Consumer / Data Flow Description"
      description: "Explain how data flows from Kafka into your dashboard — consumer logic, storage (MongoDB etc.), and how the dashboard reads it."
      placeholder: "consumer.py subscribes to 'retail-transactions', saves each message to MongoDB Atlas. Atlas Charts reads from the collection and auto-refreshes every 60 seconds..."
    validations:
      required: true

  - type: textarea
    id: dashboard_screenshot
    attributes:
      label: "Dashboard Screenshot"
      description: "Drag-and-drop a screenshot of your live running dashboard. Required for grading."
      placeholder: "Drag and drop your dashboard screenshot here..."
    validations:
      required: true

  - type: textarea
    id: business_insight
    attributes:
      label: "Business Insight Write-up"
      description: "What are 2–3 business insights a manager can act on from your dashboard? How does real-time visibility change their decision? (minimum 100 words)"
      placeholder: "Write your business insight here..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Submission Checklist"
      options:
        - label: "I have selected my section (SDA-1 / SDA-2 / SDA-G) above and updated the issue title"
          required: true
        - label: "consumer.py (or equivalent) runs and reads from Kafka without errors"
          required: true
        - label: "Dashboard has at least 3 charts or metrics"
          required: true
        - label: "Dashboard screenshot is attached"
          required: true
        - label: "Business insight write-up is included (min 100 words)"
          required: true
        - label: "My repo is public (or I have shared access with faculty)"
          required: true
        - label: "I have read and followed academic honesty guidelines"
          required: true
