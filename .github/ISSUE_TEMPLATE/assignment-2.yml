name: "🐍 Assignment 2 — Sample Data & Kafka Producer"
description: "Submit Assignment 2 — Create sample data and stream it to Kafka (10 Marks)"
title: "[A2] <Your Full Name> — Assignment 2"
labels: ["assignment-2"]
body:
  - type: markdown
    attributes:
      value: |
        ## Assignment 2 — Sample Data & Kafka Producer
        **Due:** 1 September 2026 &nbsp;|&nbsp; **Marks:** 10 &nbsp;|&nbsp; Based on the data sources from Assignment 1.

  - type: input
    id: student_name
    attributes:
      label: "Full Name"
      placeholder: "e.g. Priya Sharma"
    validations:
      required: true

  - type: input
    id: student_id
    attributes:
      label: "Student ID / Roll Number"
      placeholder: "e.g. MBA2025-042"
    validations:
      required: true

  - type: input
    id: repo_link
    attributes:
      label: "GitHub Repository Link"
      description: "Link to your public repo containing producer.py and sample data"
      placeholder: "https://github.com/your-username/sda-assignment2"
    validations:
      required: true

  - type: input
    id: kafka_topic
    attributes:
      label: "Kafka Topic Name Used"
      placeholder: "e.g. retail-transactions"
    validations:
      required: true

  - type: textarea
    id: sample_data
    attributes:
      label: "Sample Data Description"
      description: "Describe your sample data: format (CSV/JSON), fields included, how many rows, and how you generated it (manual, CSV file, Python faker, yFinance, etc.)"
      placeholder: |
        Format: JSON
        Fields: transaction_id, store_id, product_sku, quantity, price, timestamp
        Rows: 100 records in stock_data.csv
        Generated using: Python Faker library + manual domain knowledge
    validations:
      required: true

  - type: textarea
    id: producer_description
    attributes:
      label: "Producer Code Description"
      description: "Briefly explain what your producer.py does — how it reads data, what message format it sends, and at what frequency."
      placeholder: "producer.py reads from retail_data.csv row by row, serialises each row as JSON, and sends to the 'retail-transactions' topic at 1 message per second..."
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: "Terminal Screenshot / Output"
      description: "Paste your producer terminal output showing at least 10 messages sent successfully, or attach a screenshot."
      placeholder: |
        Sent: {"transaction_id": "T001", "store_id": "S01", "product_sku": "SKU123", "quantity": 2, "price": 499.0, "timestamp": "2026-09-01T10:00:00"}
        Sent: {"transaction_id": "T002", ...}
        ...
    validations:
      required: true

  - type: textarea
    id: challenges
    attributes:
      label: "Challenges & Learnings"
      description: "What was the hardest part of getting data into Kafka? What did you learn?"
      placeholder: "Optional but encouraged..."

  - type: checkboxes
    id: checklist
    attributes:
      label: "Submission Checklist"
      options:
        - label: "My producer.py runs without errors and sends data to Kafka"
          required: true
        - label: "I have included sample data (CSV or JSON file) in my repo"
          required: true
        - label: "My repo is public (or I have shared access with faculty)"
          required: true
        - label: "My submission builds directly on the industry chosen in Assignment 1"
          required: true
        - label: "I have read and followed academic honesty guidelines"
          required: true
