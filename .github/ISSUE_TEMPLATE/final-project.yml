name: "🏆 Final Project Submission"
description: "Submit your Final Project — End-to-end streaming analytics solution (40 Marks)"
title: "[PROJECT] <Team Name> — Final Project"
labels: ["project"]
body:
  - type: markdown
    attributes:
      value: |
        ## Final Project — Streaming Analytics Solution
        **Presentation:** Lecture 20 &nbsp;|&nbsp; **Marks:** 40 &nbsp;|&nbsp; **Team Size:** 3 members
        
        ### Rubric
        | Component | Weight |
        |-----------|--------|
        | Problem Statement | 25% |
        | Charts & Visualisations | 30% |
        | Identification of Data | 20% |
        | Technical Working (live demo) | 15% |
        | Discussion (Q&A) | 10% |

  - type: input
    id: team_name
    attributes:
      label: "Team Name"
      placeholder: "e.g. DataFlow Analytics"
    validations:
      required: true

  - type: textarea
    id: team_members
    attributes:
      label: "Team Members (Name + Student ID)"
      placeholder: |
        1. Priya Sharma — MBA2025-042
        2. Arjun Patel — MBA2025-018
        3. Neha Gupta — MBA2025-063
    validations:
      required: true

  - type: input
    id: repo_link
    attributes:
      label: "GitHub Repository Link"
      description: "Public repo with full source code, README, and setup instructions"
      placeholder: "https://github.com/your-team/sda-final-project"
    validations:
      required: true

  - type: dropdown
    id: industry
    attributes:
      label: "Industry / Domain"
      options:
        - "E-Commerce / Retail"
        - "Banking / Fintech"
        - "Healthcare"
        - "Logistics / Supply Chain"
        - "Media & Entertainment"
        - "Telecom"
        - "Manufacturing / IoT"
        - "Travel & Hospitality"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: "Problem Statement (25% of marks)"
      description: "What specific business problem does your project solve? Why does it require real-time streaming rather than batch processing? (minimum 150 words)"
      placeholder: |
        Business problem: [describe clearly]
        Why streaming is necessary: [explain the time-sensitivity]
        Impact if NOT solved in real-time: [quantify if possible]
        Your solution summary: [1–2 sentences]
    validations:
      required: true

  - type: textarea
    id: data_identification
    attributes:
      label: "Data Sources Identified (20% of marks)"
      description: "List all data sources, their schemas, volume, and frequency. Explain why you chose these sources."
      placeholder: |
        Source 1: [name] — [schema] — [volume/freq]
        Source 2: ...
        Kafka topics created: [topic names and purpose]
    validations:
      required: true

  - type: textarea
    id: technical_architecture
    attributes:
      label: "Technical Architecture (15% of marks)"
      description: "Describe the full pipeline: data sources → producer(s) → Kafka topics → consumer(s) → processing → dashboard. Include any additional tools used."
      placeholder: |
        Producer(s): [file names and what they do]
        Kafka topics: [names]
        Consumer(s): [file names and processing logic]
        Dashboard: [library + what it shows]
        Additional tools: [e.g. SQLite, Redis, Streamlit]
    validations:
      required: true

  - type: textarea
    id: charts_visualisations
    attributes:
      label: "Charts & Visualisations (30% of marks)"
      description: "List all dashboard charts/metrics with a brief explanation of the business insight each one provides. Attach screenshots."
      placeholder: |
        1. [Chart type] — [what it shows] — [business decision it enables]
        2. ...
        [Drag and drop dashboard screenshots here]
    validations:
      required: true

  - type: textarea
    id: demo_link
    attributes:
      label: "Demo Video Link (if not presenting live)"
      description: "YouTube, Google Drive, or Loom link to a 5-minute demo of the running pipeline and dashboard"
      placeholder: "https://loom.com/share/..."

  - type: checkboxes
    id: checklist
    attributes:
      label: "Submission Checklist"
      options:
        - label: "All 3 team members are listed with Student IDs"
          required: true
        - label: "GitHub repo is public with a clear README and setup instructions"
          required: true
        - label: "Problem statement clearly explains why streaming is needed"
          required: true
        - label: "Dashboard has at least 4 charts or metric visualisations"
          required: true
        - label: "Live pipeline demo is ready for Lecture 20 presentation"
          required: true
        - label: "All team members have read and followed academic honesty guidelines"
          required: true
