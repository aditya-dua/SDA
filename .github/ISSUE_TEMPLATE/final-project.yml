name: "🏆 Final Project Submission"
description: "Submit your Final Project (40 Marks) — End-to-end streaming analytics solution. Presented in Lecture 19 & 20."
title: "[PROJECT][SDA-?] <Team Name> — Final Project"
labels: ["project"]
body:
  - type: markdown
    attributes:
      value: |
        ## Final Project — End-to-End Streaming Analytics Solution
        **Presentation:** Lectures 19 & 20 &nbsp;|&nbsp; **Marks:** 40 &nbsp;|&nbsp; **Team Size:** up to 3 members
        **Replace SDA-? in the title with your section: SDA-1, SDA-2, or SDA-G**

        ### Grading Rubric (40 Marks = 100%)
        | Component | Weight | What We Look For |
        |-----------|--------|-----------------|
        | Problem Statement | 25% | Clear problem, why streaming is needed, business impact |
        | Charts & Visualisations | 30% | Dashboard quality, insights visible, real data shown |
        | Identification of Data | 20% | Sources justified, schemas defined, Kafka topics named |
        | Technical Working | 15% | Live demo runs, code is clean and documented |
        | Discussion (Q&A) | 10% | Team can explain design decisions |

  - type: dropdown
    id: section
    attributes:
      label: "Section"
      description: "Which section is your team enrolled in?"
      options:
        - "SDA-1"
        - "SDA-2"
        - "SDA-G"
    validations:
      required: true

  - type: input
    id: team_name
    attributes:
      label: "Team Name"
      placeholder: "e.g. DataFlow Analytics"
    validations:
      required: true

  - type: textarea
    id: team_members
    attributes:
      label: "Team Members (Full Name + Student ID)"
      placeholder: |
        1. Priya Sharma — MBA2025-042
        2. Arjun Patel — MBA2025-018
        3. Neha Gupta — MBA2025-063
    validations:
      required: true

  - type: input
    id: repo_link
    attributes:
      label: "GitHub Repository Link"
      description: "Public repo with full source code, README, and setup instructions"
      placeholder: "https://github.com/your-team/sda-final-project"
    validations:
      required: true

  - type: dropdown
    id: industry
    attributes:
      label: "Industry / Domain"
      options:
        - "E-Commerce / Retail"
        - "Banking / Fintech"
        - "Healthcare"
        - "Logistics / Supply Chain"
        - "Media & Entertainment"
        - "Telecom"
        - "Manufacturing / IoT"
        - "Travel & Hospitality"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: "Problem Statement (25% of marks)"
      description: "What specific business problem does your project solve? Why does it require real-time streaming rather than batch processing? (minimum 150 words)"
      placeholder: |
        Business problem: [describe clearly]
        Why streaming is necessary: [explain the time-sensitivity]
        Impact if NOT solved in real-time: [quantify if possible]
        Your solution summary: [1–2 sentences]
    validations:
      required: true

  - type: textarea
    id: data_identification
    attributes:
      label: "Identification of Data (20% of marks)"
      description: "List all data sources, their schemas, volume, and frequency. Name all Kafka topics and explain their purpose."
      placeholder: |
        Source 1: [name] — [schema/fields] — [volume/frequency]
        Source 2: ...
        Kafka topics:
          - [topic-name]: [what it carries]
    validations:
      required: true

  - type: textarea
    id: technical_architecture
    attributes:
      label: "Technical Working — Architecture (15% of marks)"
      description: "Full pipeline: producer(s) → Kafka → consumer(s) → storage → dashboard. Include file names and tools used."
      placeholder: |
        Producer(s): [file names and what they stream]
        Kafka topics: [names]
        Consumer(s): [file names and processing logic]
        Storage: [MongoDB Atlas / InfluxDB / etc.]
        Dashboard: [Grafana / Atlas Charts / Streamlit + what it shows]
    validations:
      required: true

  - type: textarea
    id: charts_visualisations
    attributes:
      label: "Charts & Visualisations (30% of marks)"
      description: "List every chart/metric with a brief explanation of the business insight it provides. Attach dashboard screenshots."
      placeholder: |
        1. [Chart type] — [what it shows] — [decision it enables]
        2. ...

        [Drag and drop dashboard screenshots here]
    validations:
      required: true

  - type: textarea
    id: demo_link
    attributes:
      label: "Demo Video Link (optional if presenting live)"
      description: "YouTube, Google Drive, or Loom link to a 5-minute demo of the running pipeline and dashboard"
      placeholder: "https://loom.com/share/..."

  - type: checkboxes
    id: checklist
    attributes:
      label: "Submission Checklist"
      options:
        - label: "Section selected (SDA-1 / SDA-2 / SDA-G) and issue title updated"
          required: true
        - label: "All team members listed with Student IDs"
          required: true
        - label: "GitHub repo is public with a clear README and setup instructions"
          required: true
        - label: "Problem statement explains why streaming is needed (min 150 words)"
          required: true
        - label: "Dashboard has at least 4 charts or metric visualisations"
          required: true
        - label: "Live pipeline demo is ready for presentation"
          required: true
        - label: "All team members have read and followed academic honesty guidelines"
          required: true
