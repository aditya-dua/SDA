name: "📝 Assignment 1 Submission"
description: "Submit your Assignment 1 — Streaming Consumer Analytics"
title: "[A1] <Your Name> — Assignment 1"
labels: ["assignment-1"]
body:
  - type: markdown
    attributes:
      value: |
        ## Assignment 1 — Streaming Consumer Analytics
        **Due:** End of Module 2 · Please fill in all sections before submitting.

  - type: input
    id: student_name
    attributes:
      label: "Full Name"
      placeholder: "e.g. Priya Sharma"
    validations:
      required: true

  - type: input
    id: student_id
    attributes:
      label: "Student ID / Roll Number"
      placeholder: "e.g. MBA2025-042"
    validations:
      required: true

  - type: textarea
    id: repo_link
    attributes:
      label: "GitHub Repository Link"
      description: "Link to your public repo containing the submission code"
      placeholder: "https://github.com/your-username/sda-assignment1"
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: "Files Submitted"
      description: "List the files you have submitted"
      placeholder: |
        - consumer_analytics.py
        - consumer_alerts.py
        - writeup.md
    validations:
      required: true

  - type: textarea
    id: business_question
    attributes:
      label: "Business Insight (Required Write-up)"
      description: "What is one business decision your manager could make TODAY using your real-time consumer that they could NOT make from yesterday's batch report? (minimum 100 words)"
      placeholder: "Write your answer here..."
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: "Screenshot / Output"
      description: "Paste your consumer terminal output or attach a screenshot showing at least 20 messages processed"
      placeholder: "Paste terminal output here or drag-and-drop a screenshot..."
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: "Which optional extension did you attempt?"
      options:
        - "Option A — Revenue by Product Table"
        - "Option B — Custom Alert Threshold"
        - "Option C — Orders per Minute Tracker"
        - "None (core requirements only)"
    validations:
      required: true

  - type: textarea
    id: challenges
    attributes:
      label: "Challenges / Learnings"
      description: "What was the hardest part? What surprised you?"
      placeholder: "Optional but encouraged..."

  - type: checkboxes
    id: checklist
    attributes:
      label: "Submission Checklist"
      options:
        - label: "My code runs without errors"
          required: true
        - label: "I have included the business write-up"
          required: true
        - label: "My repo is public (or I have shared access)"
          required: true
        - label: "I have read and followed academic honesty guidelines"
          required: true
