name: "📝 Assignment 1 — Industry & Data Pipeline"
description: "Submit Assignment 1 — Industry identification, data sources, and pipeline design (10 Marks)"
title: "[A1] <Your Full Name> — Assignment 1"
labels: ["assignment-1"]
body:
  - type: markdown
    attributes:
      value: |
        ## Assignment 1 — Industry & Data Pipeline Identification
        **Due:** 16 August 2026 &nbsp;|&nbsp; **Marks:** 10 &nbsp;|&nbsp; Fill in every section before submitting.

  - type: input
    id: student_name
    attributes:
      label: "Full Name"
      placeholder: "e.g. Priya Sharma"
    validations:
      required: true

  - type: input
    id: student_id
    attributes:
      label: "Student ID / Roll Number"
      placeholder: "e.g. MBA2025-042"
    validations:
      required: true

  - type: dropdown
    id: industry
    attributes:
      label: "Industry Selected"
      description: "Which industry have you chosen for your streaming analytics project?"
      options:
        - "E-Commerce / Retail"
        - "Banking / Fintech"
        - "Healthcare"
        - "Logistics / Supply Chain"
        - "Media & Entertainment"
        - "Telecom"
        - "Manufacturing / IoT"
        - "Travel & Hospitality"
        - "Other (describe below)"
    validations:
      required: true

  - type: textarea
    id: industry_justification
    attributes:
      label: "Why This Industry?"
      description: "In 2–3 sentences, explain why streaming data analytics is particularly valuable in your chosen industry."
      placeholder: "e.g. In retail, real-time inventory tracking allows stores to respond to stockouts instantly rather than discovering them in overnight batch reports..."
    validations:
      required: true

  - type: textarea
    id: data_sources
    attributes:
      label: "Data Sources Identified"
      description: "List at least 3 data sources your pipeline will use. For each, specify the source name, data type, and approximate volume/frequency."
      placeholder: |
        1. POS transaction logs — JSON events, ~500/min per store
        2. Website clickstream — page views and add-to-cart events, ~2000/min
        3. Inventory management system — stock level updates, ~100/min
    validations:
      required: true

  - type: textarea
    id: pipeline_design
    attributes:
      label: "Data Pipeline Design"
      description: "Describe the pipeline you plan to use: source → Kafka topic(s) → consumer/processing → output/dashboard. Include topic names and what each consumer will do."
      placeholder: |
        Source: POS system → Producer: pos_producer.py → Topic: transactions
        Consumer 1: real_time_revenue.py → aggregates revenue per minute
        Consumer 2: alert_consumer.py → triggers alert if revenue drops > 20%
        Output: terminal dashboard / matplotlib chart
    validations:
      required: true

  - type: textarea
    id: business_question
    attributes:
      label: "Business Decision Enabled"
      description: "What is ONE business decision a manager could make in real time with this pipeline that they CANNOT make from a daily batch report? (minimum 75 words)"
      placeholder: "Write your answer here..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Submission Checklist"
      options:
        - label: "I have identified at least 3 data sources with justification"
          required: true
        - label: "I have described my pipeline end-to-end (producer → topic → consumer → output)"
          required: true
        - label: "I have written the business decision rationale"
          required: true
        - label: "I have read and followed academic honesty guidelines"
          required: true
